[package]
name = "nucc-chunk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["nu", "nus3", "acb", "awb"]
nu = ["dep:nu"]
nut = ["nu"]
nud = ["nu"]
nus3 = ["dep:nucc-nus3"]
acb = ["dep:nucc-acb"]
awb = ["dep:nucc-awb"]

[dependencies]
binrw.workspace = true
downcast-rs.workspace = true
nu = { workspace = true, optional = true }
nucc-acb = { workspace = true, optional = true }
nucc-awb = { workspace = true, optional = true }
nucc-core.workspace = true
nucc-nus3 = { workspace = true, optional = true }
thiserror.workspace = true
